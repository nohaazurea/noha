# ============================================================
#  AZUREA — Configuration Netlify
#  Site statique. Routage par vraies URLs (History API) :
#  toute URL inconnue est servie par index.html (l'app gère la route).
#  Les fichiers réels (css, js, assets, /admin, sitemap, robots) priment.
# ============================================================

[build]
  publish = "."
  command = ""

# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le back-office ne doit pas être indexé par les moteurs
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Fallback SPA : les vraies URLs (/expertises, /projet/xxx…) renvoient index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
